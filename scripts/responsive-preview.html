<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VetOps responsive review</title><style>body{margin:0;background:#d7dde4;font:14px/1.5 system-ui}header{padding:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}label{display:flex;align-items:center;gap:7px}select{font:inherit;padding:7px}iframe{display:block;width:390px;height:844px;border:1px solid #aaa;background:#111518;max-width:100%}</style></head>
<body><header><strong>Responsive review</strong><label>Page<select id="page"><option value="/studio">Studio</option><option value="/">Home</option><option value="/margincommand">MarginCommand</option><option value="/founderrelease">Founders Release</option></select></label><label>Width<select id="width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1363">1363 px</option></select></label></header><iframe src="/studio" title="Responsive website preview"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value});document.querySelector('#width').addEventListener('change',event=>{frame.style.width=event.target.value+'px'});</script></body>
</html>
